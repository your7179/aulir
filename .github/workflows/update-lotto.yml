# 로또 당첨번호 자동 갱신
# 매주 토요일 저녁 추첨 → 일요일에 동행복권에서 새 회차를 가져와 _data/lotto.json 에 덧붙이고 저장합니다.
# 저장되면 깃허브 페이지가 사이트를 다시 만들어 분석 페이지에 새 회차가 반영됩니다.
# 시간은 UTC 기준입니다. (한국 시간 = UTC + 9시간)

name: 로또 당첨번호 갱신

on:
  schedule:
    - cron: "17 21 * * 6"   # 일요일 오전 6시 17분 (한국)
    - cron: "17 3 * * 0"    # 일요일 낮 12시 17분 (한국) - 아침에 실패했을 때 다시 시도
    - cron: "17 0 * * 1"    # 월요일 오전 9시 17분 (한국) - 마지막 확인
  workflow_dispatch:        # Actions 화면에서 [Run workflow] 단추로 바로 실행

permissions:
  contents: write           # 자료 파일 저장(커밋)
  pages: write              # 사이트 다시 만들기 요청

concurrency:
  group: lotto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 새 회차 가져오기
        run: node .github/scripts/update-lotto.mjs

      - name: 바뀐 자료 저장
        id: save
        run: |
          if git diff --quiet -- _data/lotto.json; then
            echo "새 회차가 없어 저장하지 않습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/lotto.json
          git commit -m "로또 당첨번호 자동 갱신"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 사이트 다시 만들기 요청
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true   # 실패해도 자료는 이미 저장됨 (다음 커밋 때 반영)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
